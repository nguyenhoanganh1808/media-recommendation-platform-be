name: Deploy Media Recommendation Api

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE_NAME: zoddstorm/media-recommendation-api
  AWS_REGION: ap-southeast-1
  NODE_VERSION: "23"
  APP_CONTAINER_PORT: 3443
  APP_CONTAINER_NAME: media-recommendation-api-container

jobs:
  test_and_lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter check
        run: pnpm lint

      - name: Generate Prisma Client And Create Table
        run: pnpm prisma:migrate --name init
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DUMMY }}

      - name: Run Unit/Integration Tests
        run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.DATABASE_URL_DUMMY }}
          REDIS_HOST: ${{ secrets.REDIS_HOST_DUMMY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: 1d
          JWT_REFRESH_EXPIRES_IN: 7d

  build_and_push:
    name: Build and Push Docker Image
    needs: test_and_lint
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE_NAME }}:latest
            ${{ env.DOCKERHUB_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha # Enable build cache from GitHub Actions cache
          cache-to: type=gha,mode=max # Export build cache to GitHub Actions cache

      - name: Print Image Digest
        run: echo "Pushed image digest ${{ steps.build-push.outputs.digest }}"

  deploy:
    name: Deploy to EC2
    needs: build_and_push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # --- Deploy using SSH Action ---
      - name: Deploy to EC2 instance via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # === Deployment Script on EC2 Instance ===
            set -e # Exit immediately if a command exits with a non-zero status.

            echo "Starting deployment..."

            # Ensure Docker is running
            sudo systemctl start docker || { echo "Failed to start docker"; exit 1; }

            # Login to Docker Hub (needed for pulling image)
            echo ${{ secrets.DOCKERHUB_TOKEN }} | sudo docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin || { echo "Docker Hub login failed"; exit 1; }

            # Pull the specific image version built in this workflow run
            echo "Pulling image ${{ env.DOCKERHUB_IMAGE_NAME }}:${{ github.sha }}"
            sudo docker pull ${{ env.DOCKERHUB_IMAGE_NAME }}:${{ github.sha }} || { echo "Docker pull failed"; exit 1; }

            # Stop existing container if it's running
            if [ "$(sudo docker ps -q -f name=${{ env.APP_CONTAINER_NAME }})" ]; then
                echo "Stopping existing container..."
                sudo docker stop ${{ env.APP_CONTAINER_NAME }} || echo "Failed to stop container (already stopped?)"
            fi

            # Remove existing container if it exists
            if [ "$(sudo docker ps -aq -f name=${{ env.APP_CONTAINER_NAME }})" ]; then
                echo "Removing existing container..."
                sudo docker rm ${{ env.APP_CONTAINER_NAME }} || echo "Failed to remove container (already removed?)"
            fi

            # Run the new container
            echo "Starting new container..."
            sudo docker run -d \
              --name ${{ env.APP_CONTAINER_NAME }} \
              -p ${{ env.APP_CONTAINER_PORT }}:${{ env.APP_CONTAINER_PORT }} \
              --restart unless-stopped \
              -e NODE_ENV=production \
              -e DATABASE_URL="postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}?schema=public&sslmode=prefer" `# Use secrets; added sslmode=prefer` \
              -e REDIS_URL=${{ secrets.REDIS_URL }} \
              -e REDIS_HOST=${{ secrets.REDIS_HOST }} \
              -e REDIS_PORT=${{ secrets.REDIS_PORT }} \
              -e REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e JWT_EXPIRES_IN=1d \
              -e JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }} \
              -e JWT_REFRESH_EXPIRES_IN=7d \
              -e RATE_LIMIT_WINDOW_MS=900000 \
              -e RATE_LIMIT_MAX=100 \
              -e LOG_LEVEL=info \
              -e TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} \
              -e RAWG_API_KEY=${{ secrets.RAWG_API_KEY }} \
              -e EMAIL_FROM=${{ secrets.EMAIL_FROM }} \
              -e SMTP_HOST=smtp.gmail.com \
              -e SMTP_PORT=587 \
              -e SMTP_USER=${{ secrets.SMTP_USER }} \
              -e SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }} \
              -e UPLOAD_DIRECTORY=uploads \
              -e MAX_FILE_SIZE=5000000 \
              -e RECOMMENDATION_BATCH_SIZE=100 \
              -e RECOMMENDATION_UPDATE_INTERVAL="0 */6 * * *" \
              -e DB_USER=${{ secrets.DB_USER }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e DB_PORT=5432 \
              -e REDIS_PORT=6379 \
              -e TZ=UTC \
              
              ${{ env.DOCKERHUB_IMAGE_NAME }}:${{ github.sha }}

            echo "Waiting for container to start..."
            sleep 15

            echo "Applying database migrations..."
            sudo docker exec ${{ env.APP_CONTAINER_NAME }} pnpx prisma migrate deploy || { echo "Prisma migrate deploy failed!"; exit 1; }

            echo "Cleaning up old Docker images..."
            sudo docker image prune -af

            echo "Deployment successful!"
