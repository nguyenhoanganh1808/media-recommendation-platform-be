name: Deploy Media Recommendation Api

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE_NAME: zoddstorm/media-recommendation-api
  AWS_REGION: ap-southeast-1
  NODE_VERSION: "23"
  APP_CONTAINER_PORT: 3000
  APP_CONTAINER_NAME: media-recommendation-api-container

jobs:
  test_and_lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter check
        run: pnpm lint

      - name: Generate Prisma Client And Create Table
        run: pnpm prisma:migrate --name init
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: Run Unit/Integration Tests
        run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_HOST: ${{ secrets.REDIS_HOST_DUMMY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: 1d
          JWT_REFRESH_EXPIRES_IN: 7d

  build_and_push:
    name: Build and Push Docker Image
    needs: test_and_lint
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE_NAME }}:latest
            ${{ env.DOCKERHUB_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha # Enable build cache from GitHub Actions cache
          cache-to: type=gha,mode=max # Export build cache to GitHub Actions cache

      - name: Print Image Digest
        run: echo "Pushed image digest ${{ steps.build-push.outputs.digest }}"

  deploy:
    name: Deploy to EC2
    needs: build_and_push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create production env file
        run: |
          echo "Creating .env.prod file..."
          echo "NODE_ENV=production" > .env.prod
          echo "DATABASE_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}?schema=public&sslmode=prefer" >> .env.prod
          echo "REDIS_URL=${{ secrets.REDIS_URL }}" >> .env.prod
          echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> .env.prod
          echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> .env.prod
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> .env.prod
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.prod
          echo "JWT_EXPIRES_IN=1d" >> .env.prod
          echo "JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}" >> .env.prod
          echo "JWT_REFRESH_EXPIRES_IN=7d" >> .env.prod
          echo "RATE_LIMIT_WINDOW_MS=900000" >> .env.prod
          echo "RATE_LIMIT_MAX=100" >> .env.prod
          echo "LOG_LEVEL=info" >> .env.prod
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" >> .env.prod
          echo "RAWG_API_KEY=${{ secrets.RAWG_API_KEY }}" >> .env.prod
          echo "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" >> .env.prod
          echo "SMTP_HOST=smtp.gmail.com" >> .env.prod
          echo "SMTP_PORT=587" >> .env.prod
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> .env.prod
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> .env.prod
          echo "UPLOAD_DIRECTORY=uploads" >> .env.prod
          echo "MAX_FILE_SIZE=5000000" >> .env.prod
          echo "RECOMMENDATION_BATCH_SIZE=100" >> .env.prod
          echo "RECOMMENDATION_UPDATE_INTERVAL=\"0 */6 * * *\"" >> .env.prod
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env.prod
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env.prod
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env.prod
          echo "DB_PORT=5432" >> .env.prod
          echo "TZ=UTC" >> .env.prod
          echo "Generated .env.prod:"
          cat .env.prod

      # --- Deploy using SSH Action ---
      - name: Deploy to EC2 instance via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            # === Deployment Script on EC2 Instance ===
            set -e # Exit immediately if a command exits with a non-zero status.
            APP_DIR=~/app

            echo "Deploying to $APP_DIR"
            mkdir -p $APP_DIR/nginx/conf.d # Ensure directories exist

            # === Copy files from GitHub Runner to EC2 ===
            # SCP Action could also be used, but this works with appleboy/ssh-action
            echo "Copying deployment files..."

      - name: Copy docker-compose.prod.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "docker-compose.prod.yml"
          target: "~/app/" # Target directory defined above
      - name: Copy Nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "nginx/conf.d/default.conf"
          target: "~/app/nginx/conf.d/"

      - name: Copy .env.prod file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: ".env.prod" # The file created in the previous step
          target: "~/app/"

      - name: Run deployment commands on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e # Ensure script stops on error
            APP_DIR=~/app 
            cd $APP_DIR # Navigate to the app directory

            echo "Setting environment variables for Docker Compose..."
            export DOCKERHUB_IMAGE_NAME=${{ env.DOCKERHUB_IMAGE_NAME }}
            export GITHUB_SHA=${{ github.sha }}
            export APP_CONTAINER_NAME=${{ env.APP_CONTAINER_NAME }}

            echo "Logging into Docker Hub..."
            echo ${{ secrets.DOCKERHUB_TOKEN }} | sudo docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            echo "Pulling latest images for services..."
            sudo -E docker-compose -f docker-compose.prod.yml --env-file .env.prod pull

            echo "Starting services with Docker Compose..."
            sudo -E docker-compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

            echo "Waiting for application container to start..."
            sleep 15 # Adjust if needed

            echo "Applying database migrations..."
            # Execute migration inside the 'app' container managed by compose
            # Use the container name explicitly for clarity
            sudo docker exec ${{ env.APP_CONTAINER_NAME }} npx prisma migrate deploy || { echo "Prisma migrate deploy failed!"; exit 1; }

            echo "Cleaning up old Docker images..."
            sudo docker image prune -af

            echo "Deployment successful!"
