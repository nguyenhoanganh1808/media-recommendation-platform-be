upstream node_app {
    server app:3000;
}

server {
    listen 80;
    server_name media-recommendation.chickenkiller.com;

    client_max_body_size 100M;

    location / {
        # Pass the request to the upstream Node.js application server
        proxy_pass http://node_app;

        # Set standard proxy headers to pass information to the Node.js app
        proxy_set_header Host $host; # Pass the original host header
        proxy_set_header X-Real-IP $remote_addr; # Pass the real client IP address
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Append client IP to list
        proxy_set_header X-Forwarded-Proto $scheme; # Pass the original scheme (http/https)

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ /\. {
        deny all;
    }
}