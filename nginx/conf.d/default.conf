upstream node_app {
    server app:3000;
}


server {
    listen 80;
    server_name media-recommendation.chickenkiller.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location ~ /\. {
        deny all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    http2 on;
    
    server_name media-recommendation.chickenkiller.com;

    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/media-recommendation.chickenkiller.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media-recommendation.chickenkiller.com/privkey.pem;

    # Improve SSL security
    # Use modern protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off; # Use client's preferred cipher if available

    # SSL session settings for performance
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m; # About 40000 sessions
    ssl_session_tickets off; # Consider security implications if enabling

    # OCSP Stapling for performance and privacy
    ssl_stapling on;
    ssl_stapling_verify on;

    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Hide dot files
     location ~ /\. {
        deny all;
    }

    # Proxy requests to the Node.js application
    location / {
        proxy_pass http://node_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support (if needed by your app)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}